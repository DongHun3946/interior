services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interior}
      POSTGRES_USER: ${POSTGRES_USER:-interior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interior}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interior} -d ${POSTGRES_DB:-interior}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-interior}
      DATABASE_USER: ${POSTGRES_USER:-interior}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-interior}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MEDIA_DIR: /app/media
      NAVER_MAPS_CLIENT_ID: ${NAVER_MAPS_CLIENT_ID:-}
      NAVER_MAPS_CLIENT_SECRET: ${NAVER_MAPS_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_NAVER_MAP_KEY_ID: ${NAVER_MAPS_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-interior_postgres_data}
